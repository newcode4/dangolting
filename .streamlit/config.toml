[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
font = "sans serif"
[server]
headless = true
# OneDrive·한글 경로 등에서 기본 watcher가 변경을 못 잡을 때 poll 사용
fileWatcherType = "poll"
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "auto"
