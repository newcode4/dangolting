<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080b12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080b12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#080b12"/>
  <circle cx="600" cy="120" r="380" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="240" cy="400" r="260" fill="url(#glow2)" filter="url(#blur)"/>

  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#1e293b" opacity="0.6"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <g transform="translate(80, 68)">
    <circle cx="20" cy="20" r="14" fill="#1d4ed8" opacity="0.9"/>
    <circle cx="32" cy="20" r="14" fill="#3b82f6" opacity="0.8"/>
    <text x="60" y="27" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="800" fill="#f1f5f9" letter-spacing="1">단골팅</text>
  </g>

  <rect x="80" y="140" width="380" height="36" rx="18" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="270" y="163" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="0.5" text-anchor="middle">서로 이익이 되는 파트너 매칭 · 1기 한정 · 5만 원</text>

  <text x="80" y="248" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="52" font-weight="900" fill="#f1f5f9" letter-spacing="-2">서로에게 </text>
  <text x="80" y="318" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="52" font-weight="900" letter-spacing="-2">
    <tspan fill="url(#textGrad)">진짜 도움이 되는</tspan>
  </text>
  <text x="80" y="388" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="52" font-weight="900" fill="#f1f5f9" letter-spacing="-2">비즈니스 파트너, 한 명이면 충분합니다</text>

  <rect x="80" y="430" width="270" height="56" rx="28" fill="url(#btnGrad)"/>
  <text x="215" y="465" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">지금 내 파트너 찾기 →</text>

  <text x="370" y="465" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="15" fill="#60a5fa" font-weight="600">못 찾으면 전액 환불</text>

  <line x1="0" y1="620" x2="1200" y2="620" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
  <text x="80" y="609" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" fill="#334155">dangolting.streamlit.app</text>
